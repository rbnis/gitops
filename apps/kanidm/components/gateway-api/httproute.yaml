apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kanidm
spec:
  parentRefs:
    - name: shared-gateway
      namespace: infra
      sectionName: https
  hostnames:
    - auth.rbn.is
  rules:
    - backendRefs:
        - name: rbnis
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rbnis-webfinger-tailscale
spec:
  parentRefs:
    - name: shared-gateway
      namespace: infra
      sectionName: https
  hostnames:
    - "rbn.is"
  rules:
    - matches:
        - path:
            value: "/.well-known/webfinger"
          headers:
            - name: User-Agent
              value: "Tailscale/1.0"
              type: Exact
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 307
            hostname: "auth.rbn.is"
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/oauth2/openid/tailscale/.well-known/webfinger"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: rbnis-webfinger-tailscale-acct-rewrite
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rbnis-webfinger-tailscale
  transformation:
    request:
      set:
        - name: ":path"
          value: '{{ replace_with_string(request_header(":path"), "@rbn.is", "@auth.rbn.is") }}'
