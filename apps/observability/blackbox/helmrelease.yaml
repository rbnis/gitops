apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.20.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  driftDetection:
    mode: enabled
  values:
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2", "HTTP/2.0"]
            headers:
              Accept: "*/*"
            follow_redirects: true
            preferred_ip_protocol: "ip4"
    resources:
      requests:
        cpu: 20m
        memory: 100Mi
      limits:
        memory: 100Mi
